name: Build Vance TV APK
on:
  push:
    paths: ['iptv-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['iptv-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Pick the channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BETA_COMMIT: ${{ contains(github.event.head_commit.message, '[beta]') }}
        run: |
          # Only the upstream main and beta development branches may publish releases.
          # Other branches and pull requests build a separate, manually updated preview.
          if [[ "$EVENT_NAME" == "pull_request" || "$REPO_NAME" != "jrvance2/Greens-Locks" || ( "$REF_NAME" != "main" && "$REF_NAME" != "claude/lucid-hopper-c9nw1w" ) ]]; then
            echo "BETA_FLAG=-Pbeta=true -Ppreview=true" >> "$GITHUB_ENV"; echo "TAG_PREFIX=preview" >> "$GITHUB_ENV"; echo "Preview channel"
          elif [[ "$REF_NAME" == "claude/lucid-hopper-c9nw1w" || "$BETA_COMMIT" == "true" ]]; then
            echo "BETA_FLAG=-Pbeta=true" >> "$GITHUB_ENV"; echo "TAG_PREFIX=beta" >> "$GITHUB_ENV"; echo "Beta channel"
          else
            echo "BETA_FLAG=" >> "$GITHUB_ENV"; echo "TAG_PREFIX=build" >> "$GITHUB_ENV"; echo "Stable channel"
          fi
      - name: Prepare signing key
        if: env.TAG_PREFIX != 'preview'
        env:
          KEYSTORE_BASE64: ${{ secrets.VANCETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vancetv.jks"
            echo "VANCETV_KEYSTORE=$RUNNER_TEMP/vancetv.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable Vance TV key"
          else
            echo "No signing secret set: using a temporary key (uninstall the old app before installing)"
          fi
      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG
      - run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG
        env:
          VANCETV_STORE_PASSWORD: ${{ secrets.VANCETV_STORE_PASSWORD }}
          VANCETV_KEY_ALIAS: ${{ secrets.VANCETV_KEY_ALIAS }}
          VANCETV_KEY_PASSWORD: ${{ secrets.VANCETV_KEY_PASSWORD }}
      - name: Publish release for in-app updates (stable-signed builds only)
        if: env.TAG_PREFIX != 'preview' && env.VANCETV_KEYSTORE != '' && github.repository == 'jrvance2/Greens-Locks' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VanceTV.apk
          if [ "$TAG_PREFIX" = "beta" ]; then
            # One moving pre-release: GitHub's public release list hides pre-releases, but a tag lookup works.
            gh release delete beta-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
            gh release create "beta-latest" VanceTV.apk \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Vance TV Beta build ${{ github.run_number }}" \
              --notes "Automated beta build of ${{ github.sha }}" --prerelease
          else
            gh release create "build-${{ github.run_number }}" VanceTV.apk \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Vance TV build ${{ github.run_number }}" \
              --notes "Automated build of ${{ github.sha }}" --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vancetv-${{ env.TAG_PREFIX }}-apk
          path: iptv-android/app/build/outputs/apk/release/app-release.apk
