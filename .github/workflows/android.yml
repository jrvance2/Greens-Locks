name: Build Vance TV APK
on:
  push:
    paths: ['iptv-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Pick the channel
        run: |
          # A commit message containing [beta] builds the beta channel (installs beside the stable app, own update feed).
          if [[ "${{ contains(github.event.head_commit.message, '[beta]') }}" == "true" ]]; then
            echo "BETA_FLAG=-Pbeta=true" >> "$GITHUB_ENV"; echo "TAG_PREFIX=beta" >> "$GITHUB_ENV"; echo "Beta channel"
          else
            echo "BETA_FLAG=" >> "$GITHUB_ENV"; echo "TAG_PREFIX=build" >> "$GITHUB_ENV"; echo "Stable channel"
          fi
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VANCETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vancetv.jks"
            echo "VANCETV_KEYSTORE=$RUNNER_TEMP/vancetv.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable Vance TV key"
          else
            echo "No signing secret set: using a temporary key (uninstall the old app before installing)"
          fi
      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG
      # Pictures of the shared components compared with the saved reference images; a change fails the build.
      # After an intended look change run `gradle recordRoborazziDebug` and commit src/test/screenshots.
      - name: Compare component screenshots
        run: gradle verifyRoborazziDebug --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG
      - name: Keep screenshot differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-compare
          path: iptv-android/app/build/outputs/roborazzi
          if-no-files-found: ignore
      - run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG
        env:
          VANCETV_STORE_PASSWORD: ${{ secrets.VANCETV_STORE_PASSWORD }}
          VANCETV_KEY_ALIAS: ${{ secrets.VANCETV_KEY_ALIAS }}
          VANCETV_KEY_PASSWORD: ${{ secrets.VANCETV_KEY_PASSWORD }}
      - name: Publish release for in-app updates (stable-signed builds only)
        if: env.VANCETV_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VanceTV.apk
          if [ "$TAG_PREFIX" = "beta" ]; then
            # One moving pre-release: GitHub's public release list hides pre-releases, but a tag lookup works.
            gh release delete beta-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
            gh release create "beta-latest" VanceTV.apk \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Vance TV Beta build ${{ github.run_number }}" \
              --notes "Automated beta build of ${{ github.sha }}" --prerelease
          else
            gh release create "build-${{ github.run_number }}" VanceTV.apk \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Vance TV build ${{ github.run_number }}" \
              --notes "Automated build of ${{ github.sha }}" --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vancetv-apk
          path: iptv-android/app/build/outputs/apk/release/app-release.apk
      # Opens the shrunk release build on an emulator. It runs after publishing, so a failure shows as a red build
      # for that commit without holding the release back.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build smoke APK (adds x86_64 so the emulator can run it)
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} $BETA_FLAG -Psmoke=true
        env:
          VANCETV_STORE_PASSWORD: ${{ secrets.VANCETV_STORE_PASSWORD }}
          VANCETV_KEY_ALIAS: ${{ secrets.VANCETV_KEY_ALIAS }}
          VANCETV_KEY_PASSWORD: ${{ secrets.VANCETV_KEY_PASSWORD }}
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: iptv-android
          script: bash ci/smoke.sh
      - name: Keep the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: iptv-android/smoke.png
          if-no-files-found: ignore
