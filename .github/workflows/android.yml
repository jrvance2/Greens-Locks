name: Build Vance TV APK
on:
  push:
    paths: ['iptv-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VANCETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vancetv.jks"
            echo "VANCETV_KEYSTORE=$RUNNER_TEMP/vancetv.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable Vance TV key"
          else
            echo "No signing secret set: using a temporary key (uninstall the old app before installing)"
          fi
      - run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}
        env:
          VANCETV_STORE_PASSWORD: ${{ secrets.VANCETV_STORE_PASSWORD }}
          VANCETV_KEY_ALIAS: ${{ secrets.VANCETV_KEY_ALIAS }}
          VANCETV_KEY_PASSWORD: ${{ secrets.VANCETV_KEY_PASSWORD }}
      - name: Publish release for in-app updates (stable-signed builds only)
        if: env.VANCETV_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VanceTV.apk
          gh release create "build-${{ github.run_number }}" VanceTV.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Vance TV build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: vancetv-apk
          path: iptv-android/app/build/outputs/apk/release/app-release.apk
